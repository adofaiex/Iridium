name: Bug Report
description: 报告 Iridium 的崩溃、异常或功能故障
labels: []
type: "bug"
body:
  - type: markdown
    attributes:
      value: |
        ## 感谢反馈！
        请尽可能详细地填写以下信息，这能帮助我更快定位问题。

  - type: input
    id: version
    attributes:
      label: Iridium 版本
      description: 你使用的 Iridium 版本（游戏内 Iridium 设置面板顶部可见，或见 Mods/Iridium/Info.json 与下载的压缩包文件名）
      placeholder: 2.0.1_beta1+adofai_v3
    validations:
      required: true

  - type: input
    id: game_version
    attributes:
      label: ADOFAI 游戏版本
      description: 游戏版本号（例如 2.10.0）
      placeholder: 2.10.0
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: 使用的模组加载器
      description: 你通过哪个加载器运行 Iridium？
      options:
        - UnityModManager (UMM)
        - MelonLoader
        - BepInEx
        - 其他
    validations:
      required: true

  - type: input
    id: loader_version
    attributes:
      label: 加载器版本
      description: 你使用的模组加载器版本号
      placeholder: 0.32.5.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？预期应该是什么？
      placeholder: |
        例如：打开设置页面后游戏崩溃，预期是正常显示设置页面。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: |
        1. 打开游戏
        2. 点击设置
        3. 切换到 Iridium 选项卡
        4. 崩溃
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 错误信息
      description: |
        粘贴 Unity 控制台输出或错误弹窗内容；也可以直接把 Player.log（.log）文件拖拽/粘贴到下方文本框上传。
        Player.log 文件路径：
        - Windows: %userprofile%\AppData\LocalLow\7th Beat Games\A Dance of Fire and Ice\Player.log
        - Linux: ~/.config/unity3d/7th Beat Games/A Dance of Fire and Ice/Player.log
        - macOS: ~/Library/Logs/7th Beat Games/A Dance of Fire and Ice/Player.log
      placeholder: 拖动 .log 文件到此处上传，或直接粘贴日志内容
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我使用的是适用于我游戏版本的正确 Iridium 构建
          required: true
        - label: 我已检查是否有其他 Mod 导致冲突（尝试仅启用 Iridium 复现）
          required: false
        - label: 我没有修改过 Iridium 的源代码
          required: false
