name: Question / Support
description: 关于 Iridium 的安装、使用或兼容性问题
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        ## 提问前请先查阅 README
        大部分常见问题（安装步骤、版本选择、加载器要求等）已在 README 中说明。

  - type: dropdown
    id: category
    attributes:
      label: 问题类别
      options:
        - 安装 / 部署
        - 版本选择
        - 兼容性 / 冲突
        - 功能使用
        - 其他
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: 问题内容
      description: 请详细描述你遇到的问题
      placeholder: |
        例如：我按照 README 部署后，游戏中没有出现 Iridium 的选项卡。
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Iridium 版本
      description: 你使用的 Iridium 版本（游戏内 Iridium 设置面板顶部可见，或见 Mods/Iridium/Info.json 与下载的压缩包文件名）
      placeholder: 2.0.1_beta1+adofai_v3
    validations:
      required: true

  - type: input
    id: game_version
    attributes:
      label: ADOFAI 版本
      description: 你的游戏版本号
      placeholder: 2.10.0

  - type: dropdown
    id: loader
    attributes:
      label: 使用的模组加载器
      description: 你通过哪个加载器运行 Iridium？
      options:
        - UnityModManager (UMM)
        - MelonLoader
        - BepInEx
        - 其他

  - type: input
    id: loader_version
    attributes:
      label: 加载器版本
      placeholder: 0.32.5.0
