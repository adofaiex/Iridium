name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'r*' ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - game-version: v2
            project-dir: v2
            project-file: Iridium_v2.csproj
          - game-version: v3
            project-dir: v3
            project-file: Iridium_v3.csproj
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Checkout game libraries (private)
      run: |
        git clone https://x-access-token:${{ secrets.LIBS_PAT }}@github.com/adofaiex/adofai-libs.git lib

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # Native hot-path library (iridium-core). Without this step the zip would
    # ship no native lib at all (out/ is gitignored) and every kernel would
    # silently fall back to managed code on users' machines.
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-gnu

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: native/iridium-core

    - name: Install Windows cross linker (mingw-w64)
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64

    # Linux .so + cross-compiled Windows dll, staged into out/native/ where
    # the csproj CopyToOut target picks them up for the zip.
    - name: Build native library (.so + .dll)
      run: ./scripts/build-native.sh --cross

    # Bit-exactness kernels: fail the release if a port drifts from C#.
    - name: Test native library
      run: cargo test --release --manifest-path native/iridium-core/Cargo.toml

    - name: Build loader projects
      run: |
        dotnet build loaders/ummloader/Iridium.Loader.UMM.csproj --configuration Release
        dotnet build loaders/melonloader/Iridium.Loader.Melon.csproj --configuration Release
        dotnet build loaders/bepinex/Iridium.Loader.BepInEx.csproj --configuration Release

    - name: Build project (${{ matrix.game-version }})
      run: dotnet build ${{ matrix.project-dir }}/${{ matrix.project-file }} --configuration Release

    - name: Get version
      id: get_version
      shell: bash
      run: |
        output=$(node scripts/get-version.js ${{ matrix.project-dir }} ${{ matrix.game-version }})
        while IFS= read -r line; do
          if [[ $line =~ ^VERSION_TAG=(.*)$ ]]; then
            version="${BASH_REMATCH[1]}"
            echo "VERSION_TAG=$version" >> $GITHUB_OUTPUT
          fi
          if [[ $line =~ ^BASE_TAG=(.*)$ ]]; then
            baseTag="${BASH_REMATCH[1]}"
            echo "BASE_TAG=$baseTag" >> $GITHUB_OUTPUT
          fi
        done <<< "$output"

    - name: Patch Info.json version
      shell: bash
      run: |
        node -e "
          const fs = require('fs');
          const path = 'out/${{ matrix.project-dir }}/Info.json';
          const info = JSON.parse(fs.readFileSync(path, 'utf8'));
          info.Version = '${{ steps.get_version.outputs.BASE_TAG }}';
          fs.writeFileSync(path, JSON.stringify(info, null, 2) + '\n');
        "

    - name: Package artifacts
      shell: bash
      run: |
        version="${{ steps.get_version.outputs.VERSION_TAG }}"
        zipName="Iridium_${version}.zip"
        cd out/${{ matrix.project-dir }}
        zip -r "../../${zipName}" .
        cd ../..

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iridium-build-${{ matrix.game-version }}
        path: Iridium_*.zip
        retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: iridium-build-*
        merge-multiple: true

    - name: List downloaded artifacts
      shell: bash
      run: ls -la *.zip

    - name: Get version info
      id: version_info
      shell: bash
      run: |
        output=$(node scripts/get-version.js v2)
        while IFS= read -r line; do
          if [[ $line =~ ^(VERSION_TAG|RELEASE_NAME|TAG_NAME|BASE_TAG)=(.*)$ ]]; then
            key="${BASH_REMATCH[1]}"
            value="${BASH_REMATCH[2]}"
            echo "$key=$value" >> $GITHUB_OUTPUT
          fi
        done <<< "$output"

    - name: Check for existing release
      id: check_release
      uses: actions/github-script@v7
      with:
        script: |
          const releaseName = `${{ steps.version_info.outputs.BASE_TAG }}`;

          try {
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const existingRelease = releases.data.find(r => r.name === releaseName);

            if (existingRelease) {
              core.setOutput('release_exists', 'true');
              core.setOutput('existing_release_id', existingRelease.id);
            } else {
              core.setOutput('release_exists', 'false');
            }
          } catch (error) {
            core.setOutput('release_exists', 'false');
          }

    - name: Create or update release
      id: create_release
      uses: actions/github-script@v7
      with:
        script: |
          const { generateReleaseBody } = require('./scripts/generate-release.js');

          const releaseName = `${{ steps.version_info.outputs.BASE_TAG }}`;
          const versionTag = `${{ steps.version_info.outputs.BASE_TAG }}`;
          const tagName = `${{ steps.version_info.outputs.TAG_NAME }}`;
          const releaseExists = `${{ steps.check_release.outputs.release_exists }}` === 'true';
          const existingReleaseId = `${{ steps.check_release.outputs.existing_release_id }}`;
          const shortSha = context.sha.substring(0, 7);

          let finalReleaseName = releaseName;
          let finalTagName = tagName;

          if (releaseExists) {
            finalReleaseName = `${releaseName} (${shortSha})`;
            finalTagName = `${tagName}_${shortSha}`;
          }

          const releaseBody = generateReleaseBody(versionTag, context.sha);

          try {
            if (releaseExists) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: parseInt(existingReleaseId)
              });
            }

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: finalTagName,
              name: finalReleaseName,
              body: releaseBody,
              draft: false,
              // 测试版类型（snapshot/nightly/beta）一律标记为 prerelease，避免抢占 Latest
              prerelease: ['beta', 'prerelease', 'nightly', 'snapshot'].some(t => versionTag.includes(t))
            });

            core.setOutput('release_id', release.data.id);
            core.setOutput('upload_url', release.data.upload_url);

          } catch (error) {
            core.setFailed(`Failed to create release: ${error.message}`);
          }

    - name: Upload release assets (both versions)
      uses: actions/github-script@v7
      env:
        RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const releaseId = parseInt(process.env.RELEASE_ID);

          const zipFiles = fs.readdirSync('.').filter(f => f.startsWith('Iridium_') && f.endsWith('.zip'));

          if (zipFiles.length === 0) {
            core.setFailed('No zip files found to upload');
            return;
          }

          for (const zipFile of zipFiles) {
            const fileContent = fs.readFileSync(zipFile);
            try {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name: zipFile,
                data: fileContent,
                headers: {
                  'content-type': 'application/zip',
                  'content-length': fileContent.length
                }
              });
              console.log(`Uploaded: ${zipFile}`);
            } catch (error) {
              core.setFailed(`Failed to upload ${zipFile}: ${error.message}`);
            }
          }

    - name: Update Repository jsons on mod-update repo
      shell: bash
      run: |
        git clone https://x-access-token:${{ secrets.LIBS_PAT }}@github.com/adofaiex/mod-update.git /tmp/mod-update
        cd /tmp/mod-update

        v2Tag=$(node $GITHUB_WORKSPACE/scripts/get-version.js v2 v2 | grep VERSION_TAG | cut -d= -f2)
        v3Tag=$(node $GITHUB_WORKSPACE/scripts/get-version.js v3 v3 | grep VERSION_TAG | cut -d= -f2)
        baseTag="${{ steps.version_info.outputs.BASE_TAG }}"
        tagName="${{ steps.version_info.outputs.TAG_NAME }}"

        # 测试版（snapshot/nightly/beta）不得覆盖正式更新清单，
        # 否则游戏内更新检查会把 snapshot 当作 latest 推给所有用户。
        is_test=false
        for t in beta prerelease nightly snapshot; do
          if [[ "$baseTag" == *"$t"* ]]; then is_test=true; fi
        done

        # v2 and v3 use separate manifests: the v2 client reads Iridium/Repository_v2.json
        # (see v2/Info.json), the v3 client reads Iridium/Repository.json (see v3/Info.json).
        mkdir -p Iridium
        if [[ "$is_test" == "true" ]]; then
          # 测试版写入独立清单，正式清单保持不动
          node -e "
            const fs = require('fs');
            const entry = (zipTag) => ({
              Id: 'Iridium',
              Version: '$baseTag',
              DownloadUrl: 'https://github.com/adofaiex/Iridium/releases/download/$tagName/Iridium_' + zipTag + '.zip'
            });
            fs.writeFileSync('Iridium/Repository_snapshot.json', JSON.stringify({ Releases: [entry('$v3Tag')] }, null, 2) + '\n');
            fs.writeFileSync('Iridium/Repository_snapshot_v2.json', JSON.stringify({ Releases: [entry('$v2Tag')] }, null, 2) + '\n');
          "
          git add Iridium/Repository_snapshot.json Iridium/Repository_snapshot_v2.json
        else
          node -e "
            const fs = require('fs');
            const entry = (zipTag) => ({
              Id: 'Iridium',
              Version: '$baseTag',
              DownloadUrl: 'https://github.com/adofaiex/Iridium/releases/download/$tagName/Iridium_' + zipTag + '.zip'
            });
            fs.writeFileSync('Iridium/Repository.json', JSON.stringify({ Releases: [entry('$v3Tag')] }, null, 2) + '\n');
            fs.writeFileSync('Iridium/Repository_v2.json', JSON.stringify({ Releases: [entry('$v2Tag')] }, null, 2) + '\n');
          "
          git add Iridium/Repository.json Iridium/Repository_v2.json
        fi
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git commit -m "auto-update Repository.json / Repository_v2.json for $baseTag" || true
        git push origin main
